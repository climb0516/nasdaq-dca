name: Daily Limit Update

on:
  schedule:
    - cron: '0 1 * * *'  # 01:00 UTC = 09:00 北京时间
  workflow_dispatch:       # 支持手动触发
  push:
    branches: [main]      # 任何推送到 main 都触发

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scraper
        run: python scraper.py
      - name: Commit data.json & heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          # 数据没变也提交心跳文件，保持仓库活跃，防止定时任务 60 天无提交被停用
          if git diff --cached --quiet; then
            MSG="chore: update heartbeat $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          else
            MSG="chore: 更新基金限额数据"
          fi
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S' > last_update.txt
          git add last_update.txt
          git commit -m "$MSG"
          git push
